name: release-aot

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'KuGouMusicAvalonia/Directory.Build.props'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $releaseTag = "v$version"
          $existing = git tag --list "$releaseTag"
          
          if ($existing -and "${{ github.event_name }}" -eq "push") {
            Write-Host "Tag $releaseTag already exists on server, skipping."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Will build and release $releaseTag"
            "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from project
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ./KuGouMusicAvalonia/KuGouMusicAvalonia.Desktop/KuGouMusicAvalonia.Desktop.csproj

      - name: Publish AOT (${{ matrix.rid }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"

          dotnet publish ./KuGouMusicAvalonia/KuGouMusicAvalonia.Desktop/KuGouMusicAvalonia.Desktop.csproj `
            -c Release `
            -r $rid `
            --self-contained true `
            -p:PublishAot=true `
            -p:PublishTrimmed=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:StripSymbols=true `
            -p:Version=$version `
            -p:InformationalVersion=$version `
            -o $outDir

      - name: Publish updater (${{ matrix.rid }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"

          # updater 必须和主程序一样 self-contained + AOT：
          # 用户机器上只有解压出来的这个目录，没有 .NET 运行时。
          dotnet publish ./KuGouMusicAvalonia/KuGouMusicAvalonia.Updater/KuGouMusicAvalonia.Updater.csproj `
            -c Release `
            -r $rid `
            --self-contained true `
            -p:PublishAot=true `
            -p:PublishTrimmed=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:StripSymbols=true `
            -p:Version=$version `
            -o "./artifacts/updater/$rid"

          $exe = if ($rid -like 'win-*') { 'VibeMusic.Updater.exe' } else { 'VibeMusic.Updater' }
          $src = Join-Path "./artifacts/updater/$rid" $exe
          if (-not (Test-Path $src)) {
            Write-Error "Updater executable not found at $src"
            exit 1
          }
          Copy-Item $src -Destination "./artifacts/publish/$rid/$exe" -Force

      - name: Remove debug and extra files
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"
          Get-ChildItem -Path $outDir -Recurse -File -Include *.pdb,*.dbg,*.xml | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $outDir -Recurse -Directory -Filter *.dSYM | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Ensure executable bits (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          outDir="./artifacts/publish/${{ matrix.rid }}"
          chmod +x "$outDir/VibeMusic"
          chmod +x "$outDir/VibeMusic.Updater"

      - name: Create macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          rid="${{ matrix.rid }}"
          appName="VibeMusic"
          exeName="VibeMusic"
          publishDir="./artifacts/publish/$rid"
          appDir="./artifacts/app/$rid/${appName}.app"

          # Build .app bundle skeleton
          mkdir -p "$appDir/Contents/MacOS"
          mkdir -p "$appDir/Contents/Resources"

          # Move all published files into the bundle's MacOS folder
          cp -R "$publishDir/." "$appDir/Contents/MacOS/"
          chmod +x "$appDir/Contents/MacOS/$exeName"

          # Generate .icns from the PNG logo (best-effort)
          srcPng="./KuGouMusicAvalonia/KuGouMusicAvalonia/Assets/vibe-logo.png"
          if [ -f "$srcPng" ]; then
            iconset="./artifacts/app/$rid/${appName}.iconset"
            mkdir -p "$iconset"
            # iconutil requires exactly these standard sizes; extra sizes make it fail
            for size in 16 32 128 256 512; do
              dbl=$((size * 2))
              sips -z $size $size "$srcPng" --out "$iconset/icon_${size}x${size}.png" >/dev/null 2>&1 || true
              sips -z $dbl $dbl "$srcPng" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null 2>&1 || true
            done
            if iconutil -c icns "$iconset" -o "$appDir/Contents/Resources/${appName}.icns"; then
              echo "icns generated"
            else
              echo "iconutil failed, app will use default icon"
            fi
            rm -rf "$iconset"
          else
            echo "WARNING: source png not found at $srcPng"
          fi

          # Write Info.plist
          cat > "$appDir/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>${appName}</string>
            <key>CFBundleDisplayName</key>
            <string>${appName}</string>
            <key>CFBundleIdentifier</key>
            <string>com.vibemusic.app</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleExecutable</key>
            <string>${exeName}</string>
            <key>CFBundleIconFile</key>
            <string>${appName}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.music</string>
          </dict>
          </plist>
          PLIST

          # Strip leading indentation that the heredoc preserved
          sed -i '' 's/^          //' "$appDir/Contents/Info.plist"

      - name: Pack zip
        shell: bash
        run: |
          version="${{ steps.ver.outputs.version }}"
          rid="${{ matrix.rid }}"
          zipDir="./artifacts/zips"
          zipName="vibemusic-$version-$rid.zip"
          mkdir -p "$zipDir"
          if [ "$RUNNER_OS" == "macOS" ]; then
            # Zip the .app bundle (preserve symlinks/permissions)
            cd "./artifacts/app/$rid"
            zip -ry "../../zips/$zipName" "VibeMusic.app"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            cd "./artifacts/publish/$rid"
            7z a "../../zips/$zipName" ./*
          else
            cd "./artifacts/publish/$rid"
            zip -r "../../zips/$zipName" ./*
          fi

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/zips/*.zip

  build-android:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Resolve version from project
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          "version=$($props.Project.PropertyGroup.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Decode Android keystore
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/vibemusic.jks", $bytes)

      - name: Publish Android APK (${{ matrix.abi }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $abi = "${{ matrix.abi }}"
          dotnet publish ./KuGouMusicAvalonia/KuGouMusicAvalonia.Android/KuGouMusicAvalonia.Android.csproj `
            -c Release `
            -p:Version=$version `
            -p:AndroidAbi=$abi `
            -p:AndroidSigningKeyStore="$env:RUNNER_TEMP/vibemusic.jks" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASS }}" `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASS }}" `
            -o ./artifacts/apk/$abi

      - name: Rename APK
        id: apk
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $abi = "${{ matrix.abi }}"
          $apk = Get-ChildItem -Path "./artifacts/apk/$abi" -Filter "*.apk" -Recurse | Select-Object -First 1
          if (-not $apk) { Write-Error "APK not found!"; exit 1 }
          $newname = "vibemusic-$version-$abi.apk"
          Move-Item -Path $apk.FullName -Destination "./artifacts/$newname" -Force
          "name=$newname" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: ./artifacts/vibemusic-*.apk

  release:
    runs-on: ubuntu-latest
    needs: [build, build-android]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets (Diagnostics)
        run: |
          ls -R release-assets
          find release-assets -type f \( -name "*.zip" -o -name "*.apk" \) -exec mv {} release-assets/ \;
          echo "After flattening:"
          ls -la release-assets/

      - name: Resolve release tag from project version
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate signed update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          MIRROR_BASE_URL: ${{ vars.UPDATE_MIRROR_BASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $versionCode = [long]$props.Project.PropertyGroup.AppVersionCode
          $tag = "v$version"
          $ghBase = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $mirrorBase = $env:MIRROR_BASE_URL
          if ($mirrorBase) { $mirrorBase = $mirrorBase.TrimEnd('/') }

          # 每个 RID/ABI 的落地形态：kind 决定客户端怎么装，executable 决定替换后重启谁。
          $profiles = @{
            'win-x64'     = @{ kind = 'zip';     exe = 'VibeMusic.exe' }
            'linux-x64'   = @{ kind = 'zip';     exe = 'VibeMusic' }
            'osx-x64'     = @{ kind = 'app-zip'; exe = 'VibeMusic.app' }
            'osx-arm64'   = @{ kind = 'app-zip'; exe = 'VibeMusic.app' }
            'arm64-v8a'   = @{ kind = 'apk';     exe = $null }
            'armeabi-v7a' = @{ kind = 'apk';     exe = $null }
          }

          $assets = @()
          $files = Get-ChildItem -Path ./release-assets -File |
                   Where-Object { $_.Extension -in '.zip', '.apk' } |
                   Sort-Object Name

          foreach ($file in $files) {
            # 文件名格式由 build 阶段固定：vibemusic-<version>-<platform>.<ext>
            $prefix = "vibemusic-$version-"
            if (-not $file.BaseName.StartsWith($prefix)) {
              Write-Error "Unexpected asset name: $($file.Name)"
              exit 1
            }
            $platform = $file.BaseName.Substring($prefix.Length)
            $layout = $profiles[$platform]
            if (-not $layout) {
              Write-Error "No manifest profile for platform '$platform'"
              exit 1
            }

            $sha = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

            # 国内镜像排在前面，GitHub 作为境外兜底。
            $urls = @()
            if ($mirrorBase) { $urls += "$mirrorBase/$tag/$($file.Name)" }
            $urls += "$ghBase/$($file.Name)"

            $asset = [ordered]@{
              platform = $platform
              kind     = $layout.kind
              fileName = $file.Name
              urls     = @($urls)
              size     = $file.Length
              sha256   = $sha
            }
            if ($layout.exe) { $asset['executable'] = $layout.exe }

            $assets += $asset
            Write-Host "asset: $platform  $($file.Length) bytes  $sha"
          }

          if ($assets.Count -eq 0) {
            Write-Error "No release assets found, refusing to publish an empty manifest."
            exit 1
          }

          # 发布说明取上一个 tag 到 HEAD 的提交标题。
          $previousTag = git tag --list 'v*' --sort=-v:refname |
                         Where-Object { $_ -ne $tag } |
                         Select-Object -First 1
          $range = if ($previousTag) { "$previousTag..HEAD" } else { 'HEAD' }
          $notes = (git log $range --no-merges --pretty=format:'- %s' -n 30) -join "`n"
          if (-not $notes) { $notes = "- 版本 $version" }

          $manifest = [ordered]@{
            schema       = 1
            version      = $version
            versionCode  = $versionCode
            publishedAt  = (Get-Date).ToUniversalTime().ToString('o')
            mandatory    = $false
            releaseNotes = $notes
            assets       = @($assets)
          }

          $json = $manifest | ConvertTo-Json -Depth 8
          # 显式写 UTF-8 无 BOM：签名的是文件字节，客户端读回的必须一模一样。
          $bytes = [Text.UTF8Encoding]::new($false).GetBytes($json)
          [IO.File]::WriteAllBytes("$PWD/release-assets/latest.json", $bytes)
          Write-Host $json

          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) {
            Write-Error "UPDATE_SIGNING_KEY secret is not set; clients would reject an unsigned manifest."
            exit 1
          }

          # 容忍 PEM 头尾与复制时混入的换行/空格：控制台复制长 base64 极易带上折行。
          $normalized = ($env:UPDATE_SIGNING_KEY -replace '-----[^-]+-----', '') -replace '\s', ''

          try {
            $keyBytes = [Convert]::FromBase64String($normalized)
          } catch {
            Write-Error "UPDATE_SIGNING_KEY 不是合法的 base64（规范化后长度 $($normalized.Length)）。"
            exit 1
          }

          $ecdsa = [Security.Cryptography.ECDsa]::Create()
          try {
            $ecdsa.ImportPkcs8PrivateKey($keyBytes, [ref]$null)
          } catch {
            # 只打印结构线索，绝不打印密钥内容。
            $hint = switch ($keyBytes.Length) {
              91      { ' 91 字节是 SubjectPublicKeyInfo 的长度 —— 你多半把 signing.pub.der 的公钥贴成了私钥。' }
              default { '' }
            }
            Write-Error "UPDATE_SIGNING_KEY 不是合法的 PKCS#8 私钥（解码后 $($keyBytes.Length) 字节，P-256 私钥应为 121 字节）。$hint"
            exit 1
          }

          # 私钥必须与客户端内置的公钥配对，否则发出去的版本会被所有客户端拒绝，
          # 而且要等用户报障才会发现。这里提前拦住。
          $derivedPublicKey = [Convert]::ToBase64String($ecdsa.ExportSubjectPublicKeyInfo())
          $signingSource = Get-Content ./KuGouMusicAvalonia/KuGouMusicAvalonia/Services/Update/UpdateSigning.cs -Raw
          $embedded = [regex]::Match($signingSource, 'PublicKeyBase64\s*=\s*(?:\r?\n\s*)?"([^"]*)"')
          if (-not $embedded.Success) {
            Write-Error "无法从 UpdateSigning.cs 解析 PublicKeyBase64。"
            exit 1
          }
          if ($embedded.Groups[1].Value -ne $derivedPublicKey) {
            Write-Host "UpdateSigning.cs : $($embedded.Groups[1].Value)"
            Write-Host "由私钥派生       : $derivedPublicKey"
            Write-Error "签名私钥与客户端内置公钥不匹配，本次发布会被所有客户端拒绝。请确认 UPDATE_SIGNING_KEY 与 UpdateSigning.cs 里的公钥出自同一次密钥生成。"
            exit 1
          }

          $signature = $ecdsa.SignData($bytes, [Security.Cryptography.HashAlgorithmName]::SHA256)
          $ecdsa.Dispose()

          [IO.File]::WriteAllText(
            "$PWD/release-assets/latest.json.sig",
            [Convert]::ToBase64String($signature),
            [Text.UTF8Encoding]::new($false))

          Write-Host "manifest signed ($($signature.Length) bytes)"

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.release_tag }}"
          $existing = git tag --list "$tag"
          if (-not $existing) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: VibeMusic ${{ steps.ver.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.apk
            release-assets/latest.json
            release-assets/latest.json.sig

      - name: Sync assets to China mirror
        if: ${{ vars.UPDATE_MIRROR_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_MIRROR_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_MIRROR_REGION || 'auto' }}
          MIRROR_ENDPOINT: ${{ vars.UPDATE_MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ vars.UPDATE_MIRROR_BUCKET }}
          RELEASE_TAG: ${{ steps.ver.outputs.release_tag }}
        run: |
          set -euo pipefail

          # R2 / OSS / COS / Kodo 都兼容 S3 协议，靠 endpoint 区分。
          # 产物按 tag 分目录，可长期缓存；latest.json 必须 no-cache，
          # 否则 CDN 会让用户在缓存过期前一直查不到新版本。
          aws s3 cp release-assets/ "s3://$MIRROR_BUCKET/$RELEASE_TAG/" \
            --endpoint-url "$MIRROR_ENDPOINT" \
            --recursive \
            --exclude "*" --include "*.zip" --include "*.apk" \
            --cache-control "public, max-age=31536000, immutable"

          for f in latest.json latest.json.sig; do
            aws s3 cp "release-assets/$f" "s3://$MIRROR_BUCKET/$RELEASE_TAG/$f" \
              --endpoint-url "$MIRROR_ENDPOINT" \
              --cache-control "no-cache"
            # 根目录的副本是客户端的固定入口。
            aws s3 cp "release-assets/$f" "s3://$MIRROR_BUCKET/$f" \
              --endpoint-url "$MIRROR_ENDPOINT" \
              --cache-control "no-cache"
          done

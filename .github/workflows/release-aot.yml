name: release-aot

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-13
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from project
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is empty in KuGouMusicAvalonia/Directory.Build.props"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be MAJOR.MINOR.PATCH, got: $version"
          }

          $releaseTag = "v$version"
          if ("${{ github.event_name }}" -eq "push") {
            $pushedTag = "${{ github.ref_name }}"
            if ($pushedTag -ne $releaseTag) {
              throw "Tag/version mismatch: pushed '$pushedTag' but project version is '$releaseTag'"
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ./KuGouMusicAvalonia/KuGouMusicAvalonia.Desktop/KuGouMusicAvalonia.Desktop.csproj

      - name: Publish AOT (${{ matrix.rid }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"

          dotnet publish ./KuGouMusicAvalonia/KuGouMusicAvalonia.Desktop/KuGouMusicAvalonia.Desktop.csproj `
            -c Release `
            -r $rid `
            --self-contained true `
            -p:PublishAot=true `
            -p:PublishTrimmed=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:StripSymbols=true `
            -p:Version=$version `
            -p:InformationalVersion=$version `
            -o $outDir

      - name: Remove debug and extra files
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"
          Get-ChildItem -Path $outDir -Recurse -File -Include *.pdb,*.dbg,*.xml | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $outDir -Recurse -Directory -Filter *.dSYM | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Pack zip
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"
          $zipDir = "./artifacts/zips"
          $zipName = "vibemusic-$version-$rid.zip"
          New-Item -ItemType Directory -Force -Path $zipDir | Out-Null
          Compress-Archive -Path "$outDir/*" -DestinationPath "$zipDir/$zipName" -Force

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/zips/*.zip

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag from project version
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version in KuGouMusicAvalonia/Directory.Build.props"
          }
          "release_tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Ensure release tag exists (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.release_tag }}"
          $existing = git tag --list "$tag"
          if (-not $existing) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: VibeMusic ${{ steps.ver.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/**/*.zip

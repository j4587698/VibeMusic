name: release-aot

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'KuGouMusicAvalonia/Directory.Build.props'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $releaseTag = "v$version"
          $existing = git tag --list "$releaseTag"
          
          if ($existing -and "${{ github.event_name }}" -eq "push") {
            Write-Host "Tag $releaseTag already exists on server, skipping."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Will build and release $releaseTag"
            "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-14
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from project
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ./KuGouMusicAvalonia/KuGouMusicAvalonia.Desktop/KuGouMusicAvalonia.Desktop.csproj

      - name: Publish AOT (${{ matrix.rid }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"

          dotnet publish ./KuGouMusicAvalonia/KuGouMusicAvalonia.Desktop/KuGouMusicAvalonia.Desktop.csproj `
            -c Release `
            -r $rid `
            --self-contained true `
            -p:PublishAot=true `
            -p:PublishTrimmed=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:StripSymbols=true `
            -p:Version=$version `
            -p:InformationalVersion=$version `
            -o $outDir

      - name: Remove debug and extra files
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"
          Get-ChildItem -Path $outDir -Recurse -File -Include *.pdb,*.dbg,*.xml | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $outDir -Recurse -Directory -Filter *.dSYM | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Create macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          rid="${{ matrix.rid }}"
          appName="VibeMusic"
          exeName="VibeMusic"
          publishDir="./artifacts/publish/$rid"
          appDir="./artifacts/app/$rid/${appName}.app"

          # Build .app bundle skeleton
          mkdir -p "$appDir/Contents/MacOS"
          mkdir -p "$appDir/Contents/Resources"

          # Move all published files into the bundle's MacOS folder
          cp -R "$publishDir/." "$appDir/Contents/MacOS/"
          chmod +x "$appDir/Contents/MacOS/$exeName"

          # Generate .icns from the PNG logo (best-effort)
          srcPng="./KuGouMusicAvalonia/KuGouMusicAvalonia/Assets/vibe-logo.png"
          if [ -f "$srcPng" ]; then
            iconset="./artifacts/app/$rid/${appName}.iconset"
            mkdir -p "$iconset"
            # iconutil requires exactly these standard sizes; extra sizes make it fail
            for size in 16 32 128 256 512; do
              dbl=$((size * 2))
              sips -z $size $size "$srcPng" --out "$iconset/icon_${size}x${size}.png" >/dev/null 2>&1 || true
              sips -z $dbl $dbl "$srcPng" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null 2>&1 || true
            done
            if iconutil -c icns "$iconset" -o "$appDir/Contents/Resources/${appName}.icns"; then
              echo "icns generated"
            else
              echo "iconutil failed, app will use default icon"
            fi
            rm -rf "$iconset"
          else
            echo "WARNING: source png not found at $srcPng"
          fi

          # Write Info.plist
          cat > "$appDir/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>${appName}</string>
            <key>CFBundleDisplayName</key>
            <string>${appName}</string>
            <key>CFBundleIdentifier</key>
            <string>com.vibemusic.app</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleExecutable</key>
            <string>${exeName}</string>
            <key>CFBundleIconFile</key>
            <string>${appName}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.music</string>
          </dict>
          </plist>
          PLIST

          # Strip leading indentation that the heredoc preserved
          sed -i '' 's/^          //' "$appDir/Contents/Info.plist"

      - name: Pack zip
        shell: bash
        run: |
          version="${{ steps.ver.outputs.version }}"
          rid="${{ matrix.rid }}"
          zipDir="./artifacts/zips"
          zipName="vibemusic-$version-$rid.zip"
          mkdir -p "$zipDir"
          if [ "$RUNNER_OS" == "macOS" ]; then
            # Zip the .app bundle (preserve symlinks/permissions)
            cd "./artifacts/app/$rid"
            zip -ry "../../zips/$zipName" "VibeMusic.app"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            cd "./artifacts/publish/$rid"
            7z a "../../zips/$zipName" ./*
          else
            cd "./artifacts/publish/$rid"
            zip -r "../../zips/$zipName" ./*
          fi

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/zips/*.zip

  build-android:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Resolve version from project
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          "version=$($props.Project.PropertyGroup.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Decode Android keystore
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/vibemusic.jks", $bytes)

      - name: Publish Android APK (${{ matrix.abi }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $abi = "${{ matrix.abi }}"
          dotnet publish ./KuGouMusicAvalonia/KuGouMusicAvalonia.Android/KuGouMusicAvalonia.Android.csproj `
            -c Release `
            -p:Version=$version `
            -p:AndroidAbi=$abi `
            -p:AndroidSigningKeyStore="$env:RUNNER_TEMP/vibemusic.jks" `
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASS }}" `
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASS }}" `
            -o ./artifacts/apk/$abi

      - name: Rename APK
        id: apk
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $abi = "${{ matrix.abi }}"
          $apk = Get-ChildItem -Path "./artifacts/apk/$abi" -Filter "*.apk" -Recurse | Select-Object -First 1
          if (-not $apk) { Write-Error "APK not found!"; exit 1 }
          $newname = "vibemusic-$version-$abi.apk"
          Move-Item -Path $apk.FullName -Destination "./artifacts/$newname" -Force
          "name=$newname" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: ./artifacts/vibemusic-*.apk

  release:
    runs-on: ubuntu-latest
    needs: [build, build-android]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets (Diagnostics)
        run: |
          ls -R release-assets
          find release-assets -type f \( -name "*.zip" -o -name "*.apk" \) -exec mv {} release-assets/ \;
          echo "After flattening:"
          ls -la release-assets/

      - name: Resolve release tag from project version
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          "release_tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.release_tag }}"
          $existing = git tag --list "$tag"
          if (-not $existing) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: VibeMusic ${{ steps.ver.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.apk

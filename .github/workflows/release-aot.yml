name: release-aot

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $releaseTag = "v$version"
          $existing = git tag --list "$releaseTag"
          
          if ($existing -and "${{ github.event_name }}" -eq "push") {
            Write-Host "Tag $releaseTag already exists on server, skipping."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Will build and release $releaseTag"
            "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-14
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from project
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ./KuGouMusicAvalonia/KuGouMusicAvalonia.Desktop/KuGouMusicAvalonia.Desktop.csproj

      - name: Publish AOT (${{ matrix.rid }})
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"

          dotnet publish ./KuGouMusicAvalonia/KuGouMusicAvalonia.Desktop/KuGouMusicAvalonia.Desktop.csproj `
            -c Release `
            -r $rid `
            --self-contained true `
            -p:PublishAot=true `
            -p:PublishTrimmed=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:StripSymbols=true `
            -p:Version=$version `
            -p:InformationalVersion=$version `
            -o $outDir

      - name: Remove debug and extra files
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $outDir = "./artifacts/publish/$rid"
          Get-ChildItem -Path $outDir -Recurse -File -Include *.pdb,*.dbg,*.xml | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $outDir -Recurse -Directory -Filter *.dSYM | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Pack zip
        shell: bash
        run: |
          version="${{ steps.ver.outputs.version }}"
          rid="${{ matrix.rid }}"
          outDir="./artifacts/publish/$rid"
          zipDir="./artifacts/zips"
          zipName="vibemusic-$version-$rid.zip"
          mkdir -p "$zipDir"
          cd "$outDir"
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "../../zips/$zipName" ./*
          else
            zip -r "../../zips/$zipName" ./*
          fi

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: artifacts/zips/*.zip

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets (Diagnostics)
        run: |
          ls -R release-assets
          # Flatten all zip files into the root of release-assets to avoid globbing issues
          find release-assets -type f -name "*.zip" -exec mv {} release-assets/ \;
          echo "After flattening:"
          ls -la release-assets/

      - name: Resolve release tag from project version
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./KuGouMusicAvalonia/Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          "release_tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.release_tag }}"
          $existing = git tag --list "$tag"
          if (-not $existing) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: VibeMusic ${{ steps.ver.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*.zip
